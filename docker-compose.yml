name: policypilot

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - policypilot_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      POLICYPILOT_BACKEND_URL: http://backend:8000/api
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

  crawler:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.tools
    env_file: .env
    command: ["python", "-m", "scripts.run_crawler"]
    volumes:
      - policypilot_data:/app/data

  ingester:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    command: ["python", "-m", "scripts.run_ingestion"]
    volumes:
      - policypilot_data:/app/data

volumes:
  policypilot_data:
